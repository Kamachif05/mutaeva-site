server {
    listen 80;
    server_name admin.mutaeva.ru;
    location /.well-known/acme-challenge/ { root /srv/mutaeva-site/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name admin.mutaeva.ru;
    ssl_certificate /etc/letsencrypt/live/admin.mutaeva.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mutaeva.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
